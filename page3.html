     <div style="text-align: center;"margin-top:30px;direction:ltr;font-family:Arial;"<h2>customize your cake</h2>
        <p> choose your fav flavor your cake :</p>
        <form style="display:inline-block;text-align:left;">
            <input type="checkbox" id="chocolate" name="flavor" value="chocolate">
            <label for="chocolate"> chocolate</label><br>
            <input type="checkbox" id="vanilla" name="flavor" value="vanilla">
            <label for="vanilla"> vanilla</label><br>
            <input type="checkbox" id="strawberry" name="flavor" value="strawberry">
            <label for="strawberry"> strawberry</label><br>
            <input type="checkbox" id="redvelvet" name="flavor" value="redvelvet">
            <label for="redvelvet"> red velvet</label><br>
        </form>
        <p>choose your fav size for the cake :</p>
        <form style="display:inline-block;text-align:left;">
            <input type="checkbox" id="small" name="size" value="small">
            <label for="small"> small</label><br>
            <input type="checkbox" id="medium" name="size" value="medium">
            <label for="medium"> medium</label><br>
            <input type="checkbox" id="large" name="size" value="large">
            <label for="large"> large</label><br>
        </form>
        <p>choose your fav form for the cake :</p>
        <form style="display:inline-block;text-align:left;">
            <input type="checkbox" id="round" name="form" value="round">
            <label for="round"> round</label><br>
            <input type="checkbox" id="square" name="form" value="square">
            <label for="square"> square</label><br>
            <input type="checkbox" id="heart" name="form" value="heart">
            <label for="heart"> heart</label><br>
        </form>
        <p>choose your fav price for the cake :</p>
        <form>
            <input type="radio" id="price1" name="price" value="price1">
            <label for="price1"> 100-200</label><br>
            <input type="radio" id="price2" name="price" value="price2">
            <label for="price2"> 200-300</label><br>
            <input type="radio" id="price3" name="price" value="price3">
            <label for="price3"> 300-400</label><br>
            </form>
